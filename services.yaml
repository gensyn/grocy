check_missing_products:
  name: Check missing products
  description: >
    Checks all products in the Grocy instance against their configured minimum
    stock amounts. For each product whose current stock is below the minimum,
    the missing quantity is added to the specified todo list. The todo item
    summary is the product name; the amount and unit are stored in the
    description field. Existing todo items with the same product and unit are
    updated by adding the amounts together rather than creating a duplicate
    entry. Completed items are never merged with.
  fields:
    entity_id:
      name: Entity ID
      description: The sensor entity of the Grocy integration entry to use.
      required: true
      selector:
        entity:
          domain: sensor
    todo_list:
      name: Todo list
      description: >
        The todo list entity to which the missing product amounts are added.
      required: true
      selector:
        entity:
          domain: todo

add_meal:
  name: Add meal
  description: >
    Pins a specific recipe to a date by adding it directly to the calendar and
    adding its ingredients to the todo list — no notification or suggestion flow
    is involved. Use this when you already know what you want to eat.
  fields:
    entity_id:
      name: Entity ID
      description: The sensor entity of the Grocy integration entry to use.
      required: true
      selector:
        entity:
          domain: sensor
    date:
      name: Date
      description: The date for which the meal should be planned.
      required: true
      selector:
        date:
    recipe:
      name: Recipe name
      description: >
        The name of the recipe as it appears in Grocy. The search is
        case-insensitive and the "[meal_type]" prefix is ignored, so you can
        supply either the full name (e.g. "[Dinner] Pasta") or just the display
        name (e.g. "Pasta").
      required: true
      selector:
        text:
    calendar:
      name: Calendar
      description: The calendar entity to add the meal event to.
      required: true
      selector:
        entity:
          domain: calendar
    todo_list:
      name: Todo list
      description: >
        The todo list entity to which the ingredients of the recipe are added.
      required: true
      selector:
        entity:
          domain: todo

plan_meal:
  name: Plan meal
  description: >
    Picks a random recipe from the Grocy instance, sends it as a suggestion via
    the specified notify service, and allows the user to accept, dismiss or cancel.
    Accepted recipes are added to the calendar and their ingredients are added to
    the todo list.
  fields:
    entity_id:
      name: Entity ID
      description: The sensor entity of the Grocy integration entry to use.
      required: true
      selector:
        entity:
          domain: sensor
    date:
      name: Date
      description: The date for which the meal should be planned.
      required: true
      selector:
        date:
    meal_type:
      name: Meal type
      description: >
        Arbitrary string used as a filter. Only recipes whose name begins with
        "[meal_type]" will be considered.
      required: true
      selector:
        text:
    calendar:
      name: Calendar
      description: >
        The calendar entity to check for recent meals (blacklist) and to add the
        accepted meal to.
      required: true
      selector:
        entity:
          domain: calendar
    todo_list:
      name: Todo list
      description: >
        The todo list entity to which the ingredients of the accepted recipe are
        added.
      required: true
      selector:
        entity:
          domain: todo
    notify:
      name: Notify service
      description: >
        The notify service entity to send the meal suggestion to.
      required: true
      selector:
        entity:
          domain: notify
    blacklist:
      name: Blacklist (days)
      description: >
        Number of days to look back in the calendar. Recipes that were already
        planned within this period are excluded from suggestions.
      required: true
      selector:
        number:
          min: 0
          max: 365
          unit_of_measurement: days
